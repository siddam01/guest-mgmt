name: CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  tests:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: siddam01/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, xml, mysql, dom, fileinfo
        
    - name: Copy Environment
      run: Copy-Item .env.example .env
      
    - name: Install Dependencies
      run: |
        composer install --prefer-dist --no-progress
        npm install
        
    - name: Execute Tests
      run: php artisan test
